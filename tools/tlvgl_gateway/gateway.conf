# ==============================================================================
# Archivo de Configuración del Gateway-Router CBDos (gateway.conf)
# ==============================================================================

# Puerto TCP para clientes locales / Wi-Fi
PORT=8080

# Puerto serie del Dongle USB ESP-NOW (deja en blanco para auto o pásalo por CLI)
SERIAL_PORT=/dev/ttyACM0

# Modo de desarrollo / Telemetría detallada (true / false)
# Muestra tarjetas ASCII de cada cliente, IP Mesh, Short ID, RSSI y ACL
DEBUG=true

# Directorio de contenido de páginas .mesh
CONTENT_DIR=content

# Permiso por defecto de salida al Proxy de Internet para nuevos nodos
PROXY_ENABLED_BY_DEFAULT=true
