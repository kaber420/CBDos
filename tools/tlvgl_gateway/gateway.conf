# ==============================================================================
# Archivo de Configuración Modular del Gateway-Router CBDos (gateway.conf)
# ==============================================================================

# Servicios activos en este Gateway / Torre:
# Opciones separadas por coma: routing, hosting, proxy (o 'all')
#   • routing : Mantiene la tabla Pseudo-ARP SQLite3, DAD y handshakes L3
#   • hosting : Servidor de páginas .mesh locales y compilador TLVGL
#   • proxy   : Transcodificador y salida a Internet exterior para nodos autorizados
SERVICES=routing,hosting,proxy

# Puerto TCP para clientes Wi-Fi / LAN
PORT=8080

# Puerto serie del Dongle USB ESP-NOW
SERIAL_PORT=/dev/ttyACM0

# Modo de radio para el Dongle: normal | lr
RADIO_MODE=lr

# Modo de desarrollo / Telemetría detallada en consola (true / false)
DEBUG=true

# Directorio de contenido de páginas .mesh locales
CONTENT_DIR=content

# Permiso por defecto de salida al Proxy de Internet para nuevos nodos
PROXY_ENABLED_BY_DEFAULT=true
