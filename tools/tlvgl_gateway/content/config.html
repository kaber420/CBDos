<!DOCTYPE html>
<html>
<head><title>Configuracion de Nodo</title></head>
<body>
  <panel style="left: 12px; top: 10px; width: 456px; height: 50px; background-color: #181c26;">
    <h1>Configuracion de Nodo y Radio</h1>
  </panel>

  <p style="left: 12px; top: 70px;">Nombre del Nodo Mesh:</p>
  <input type="text" name="nodename" placeholder="ESP32-CyberDeck" style="left: 12px; top: 92px; width: 456px; height: 38px;">

  <p style="left: 12px; top: 140px;">Activar Radio LoRa 915 MHz:</p>
  <input type="checkbox" class="toggle" checked style="left: 380px; top: 136px;">

  <p style="left: 12px; top: 180px;">Punto de Acceso WiFi Alternet:</p>
  <input type="checkbox" class="toggle" checked style="left: 380px; top: 176px;">

  <p style="left: 12px; top: 220px;">Potencia de Transmision (dBm):</p>
  <input type="range" min="2" max="22" value="14" style="left: 12px; top: 245px; width: 456px; height: 26px;">

  <input type="checkbox" checked style="left: 12px; top: 285px; width: 456px;"> Guardar telemetria en MicroSD

  <a href="/index.html" style="left: 12px; top: 330px; width: 456px;">💾 Guardar y Volver a Inicio</a>
</body>
</html>
