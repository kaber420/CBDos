  <line x1="23" y1="36" x2="36" y2="36" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <line x1="23" y1="42" x2="30" y2="42" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
