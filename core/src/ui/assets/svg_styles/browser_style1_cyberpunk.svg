<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fondo Squircle Oscuro con Brillo Azul -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#001F54"/>
    </linearGradient>
    <!-- Degradado Neón Cian -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Globo Terráqueo con Meridianos y Anillo Orbital -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="url(#neonCyan)" stroke-width="2"/>
  <ellipse cx="32" cy="32" rx="7" ry="16" fill="none" stroke="url(#neonCyan)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="16" y1="32" x2="48" y2="32" stroke="url(#neonCyan)" stroke-width="1.5"/>
  <!-- Anillo Órbita Planetaria en Ángulo -->
  <ellipse cx="32" cy="32" rx="22" ry="7" fill="none" stroke="#F72585" stroke-width="2" transform="rotate(-30 32 32)"/>
  <circle cx="48" cy="23" r="2.5" fill="#F72585"/>
</svg>
