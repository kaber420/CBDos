<!DOCTYPE html>
<html>
<head><title>Dashboard Bento</title></head>
<body>
  <h1>Dashboard Bento</h1>
  <h2>Telemetria en Tiempo Real</h2>

  <!-- Card 1: Sensor de Temperatura -->
  <panel style="background-color: #161b26; height: 90px;">
    <i class="fa fa-thermometer-half"></i>
    <h3>Temperatura Ambiente</h3>
    <p>24.5 °C — Sensor SHT31 Activo</p>
  </panel>

  <!-- Card 2: Estado de Bateria -->
  <panel style="background-color: #0d1b2a; height: 90px;">
    <i class="fa fa-battery-full"></i>
    <h3>Bateria del Nodo</h3>
    <p>98% (4.15V) — Carga Solar Activa</p>
  </panel>

  <!-- Card 3: Estado de Red Mesh -->
  <panel style="background-color: #1a1a2e; height: 90px;">
    <i class="fa fa-wifi"></i>
    <h3>Conexion Mesh LoRa</h3>
    <p>RSSI: -65 dBm | Nodo Gateway #00FE</p>
  </panel>

  <!-- Card 4: Accion de Navegacion -->
  <panel style="background-color: #111827; height: 80px;">
    <a href="/index.html">Volver a Inicio</a>
  </panel>
</body>
</html>
